<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
  <title id="title">Anode und Kathode einer LED</title><desc id="desc">Eine übersichtliche LED mit langem Anodenbein an Plus und kurzem Kathodenbein an Minus.</desc>
  <defs><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb1b3" stop-opacity=".8"/><stop offset="1" stop-color="#ed3f48" stop-opacity=".9"/></linearGradient><marker id="ag" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#16805b"/></marker><marker id="ab" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#3568c8"/></marker></defs>
  <rect width="1000" height="610" rx="28" fill="#f7f9fc"/><text x="50" y="58" font-family="Arial" font-size="30" font-weight="700" fill="#172033">Anode und Kathode erkennen</text><text x="50" y="92" font-family="Arial" font-size="18" fill="#526079">Eine LED muss richtig herum angeschlossen werden.</text>
  <rect x="50" y="125" width="900" height="365" rx="22" fill="#fff" stroke="#dce3ed" stroke-width="2"/>
  <path d="M385 320V247a115 115 0 0 1 230 0v73Z" fill="url(#glass)" stroke="#172033" stroke-width="6"/><path d="M385 320h230v22H385Z" fill="#ef555c" stroke="#172033" stroke-width="6"/><line x1="430" y1="342" x2="430" y2="465" stroke="#727c89" stroke-width="12"/><line x1="570" y1="342" x2="570" y2="425" stroke="#727c89" stroke-width="12"/>
  <path d="M430 310v-35l45-20v55" fill="none" stroke="#ffe18a" stroke-width="7"/><path d="M520 310v-62h45v62" fill="#cda842" stroke="#7c6220" stroke-width="3"/><line x1="475" y1="267" x2="520" y2="257" stroke="#ffe18a" stroke-width="4"/>
  <rect x="82" y="185" width="240" height="125" rx="18" fill="#e9f7f1"/><text x="105" y="225" font-family="Arial" font-size="25" font-weight="700" fill="#126c4d">Anode (+)</text><text x="105" y="258" font-family="Arial" font-size="19" fill="#172033">• längeres Bein</text><text x="105" y="288" font-family="Arial" font-size="19" fill="#172033">• Richtung Pluspol</text><path d="M320 280c45 20 70 60 105 125" fill="none" stroke="#16805b" stroke-width="4" marker-end="url(#ag)"/>
  <rect x="678" y="185" width="240" height="155" rx="18" fill="#edf3ff"/><text x="701" y="225" font-family="Arial" font-size="25" font-weight="700" fill="#315da9">Kathode (−)</text><text x="701" y="258" font-family="Arial" font-size="19" fill="#172033">• kürzeres Bein</text><text x="701" y="288" font-family="Arial" font-size="19" fill="#172033">• flache Gehäuseseite</text><text x="701" y="318" font-family="Arial" font-size="19" fill="#172033">• Richtung Minuspol</text><path d="M680 300c-50 15-70 50-105 90" fill="none" stroke="#3568c8" stroke-width="4" marker-end="url(#ab)"/>
  <text x="430" y="482" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#16805b">lang</text><text x="570" y="447" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#3568c8">kurz</text>
  <rect x="90" y="520" width="820" height="58" rx="16" fill="#e8eef8"/><text x="500" y="556" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#172033">Plus → Widerstand → Anode → LED → Kathode → Minus</text>
</svg>
